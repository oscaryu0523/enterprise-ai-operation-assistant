services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: aiassistant
      POSTGRES_USER: aiassistant
      POSTGRES_PASSWORD: aiassistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiassistant -d aiassistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/aiassistant
      SPRING_DATASOURCE_USERNAME: aiassistant
      SPRING_DATASOURCE_PASSWORD: aiassistant
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
