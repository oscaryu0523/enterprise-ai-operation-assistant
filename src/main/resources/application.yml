spring:
  application:
    name: enterprise-ai-operation-assistant
  datasource:
    url: jdbc:postgresql://localhost:5432/aiassistant
    username: aiassistant
    password: aiassistant
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-do-not-use-in-production-change-me-now!}
    expiration-seconds: 86400
